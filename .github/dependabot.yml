version: 2

# Minor and patch updates are grouped into one PR per ecosystem. Major updates
# arrive as separate PRs so one breaking release cannot block the others.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6. Remove once it accepts 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
