name: Update walkshed data

on:
  schedule:
    # Run after the monthly stop snapshot refresh on the first day.
    - cron: '17 4 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-osm-data-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends osmium-tool

      # Walksheds route on a local OSM extract rather than thousands of public
      # Overpass requests, which throttled and timed out the previous builds.
      - name: Prepare OSM extract
        run: npm run prepare:osm-extract

      - name: Build walksheds
        run: >-
          npm run build:walksheds --
          --progress-file walkshed-progress.txt
          --diagnostics-file walkshed-diagnostics.json

      # `always()` so failed, cancelled, and timed-out builds still publish the
      # checkpointed diagnostics they managed to write.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: walkshed-diagnostics
          path: |
            walkshed-progress.txt
            walkshed-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify generated data
        run: |
          npm run verify
          npm run build

      - name: Commit updated walkshed data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add public/data/walksheds-*.json
          if git diff --cached --quiet; then
            echo "Walkshed data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update precomputed walkshed data"
          # Only this workflow writes these files, so rebasing over commits
          # pushed during the build cannot conflict.
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
